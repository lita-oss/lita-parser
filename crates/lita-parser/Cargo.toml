[package]
name = "lita-parser"
version = "0.2.0"
edition = "2024"
description = "Parser APIs that are used in LiTA."

authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["txt-full", "json-full", "csv-full", "decode", "stream"]

bytes-full = ["txt-bytes", "json-bytes", "csv-bytes"]
io-full = ["txt-io", "json-io", "csv-io"]
fs-full = ["txt-fs", "json-fs", "csv-fs"]

txt-full = ["txt-bytes", "txt-io", "txt-fs"]
txt-bytes = []
txt-io = ["tokio/io-util"]
txt-fs = ["txt-io", "tokio/fs"]

json-full = ["json-bytes", "json-io", "json-fs"]
json-bytes = ["dep:serde", "dep:serde_json"]
json-io = ["dep:serde", "dep:serde_json", "tokio/io-util"]
json-fs = ["json-io", "tokio/fs"]

csv-full = ["csv-bytes", "csv-io", "csv-fs"]
csv-bytes = ["dep:serde", "dep:csv"]
csv-io = ["dep:serde", "dep:csv-async", "tokio/io-util"]
csv-fs = ["csv-io", "tokio/fs"]

decode = ["dep:encoding_rs", "dep:unicode-bom"]

stream = ["dep:futures-util"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
csv = { version = "1.4", optional = true }
csv-async = { version = "1.3", features = ["tokio", "with_serde"], optional = true }

unicode-bom = { version = "2.0", optional = true }
encoding_rs = { version = "0.8", optional = true }

futures-util = { version = "0.3", optional = true }

tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
