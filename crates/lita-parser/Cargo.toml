[package]
name = "lita-parser"
version = "0.3.0"
edition = "2024"
description = "Parser APIs that are used in LiTA."

authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["sync-full", "tokio-io-full", "fs", "decode", "stream"]

sync-full = ["txt-sync", "json-sync", "csv-sync"]
tokio-io-full = ["txt-tokio-io", "json-tokio-io", "csv-tokio-io"]

txt-full = ["txt-sync", "txt-tokio-io"]
txt-sync = []
txt-tokio-io = ["tokio-io"]

json-full = ["json-sync", "json-tokio-io"]
json-sync = ["dep:serde", "dep:serde_json"]
json-tokio-io = ["dep:serde", "dep:serde_json", "tokio-io"]

csv-full = ["csv-sync", "csv-tokio-io"]
csv-sync = ["dep:serde", "dep:csv"]
csv-tokio-io = ["dep:serde", "dep:csv-async", "tokio-io"]

fs = ["tokio?/fs"]
tokio-io = ["tokio/io-util"]

decode = ["dep:encoding_rs"]

stream = ["dep:futures-util"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
csv = { version = "1.4", optional = true }
csv-async = { version = "1.3", features = ["tokio", "with_serde"], optional = true }

encoding_rs = { version = "0.8", optional = true }
unicode-bom = "2.0"

futures-util = { version = "0.3", default-features = false, optional = true }

tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
