[package]
name = "lita-parser-cli"
version = "0.3.0"
edition = "2024"
description = "Parser CLI that are used in LiTA."

authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["json", "csv", "decode"]

json = ["lita-parser/json-tokio-io"]
csv = ["lita-parser/csv-tokio-io"]

decode = ["lita-parser/decode"]

[dependencies]
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal"] }
lita-parser = { workspace = true, default-features = false, features = ["stream", "txt-tokio-io", "fs"] }

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
