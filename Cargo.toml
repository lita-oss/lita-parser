[workspace]
members = ["./crates/*", "xtask"]
default-members = ["./crates/*"]
resolver = "3"

[workspace.package]
authors = ["Masato Nakata <masaton@naughie.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lita-oss/lita-parser"
homepage = "https://github.com/lita-oss/lita-parser"

[workspace.dependencies]
lita-parser = { path = "./crates/lita-parser", version = "0.2.0" }

tokio = { version = "1" }
serde = { version = "1.0" }
serde_json = { version = "1.0" }

[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"
